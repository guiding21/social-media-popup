<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>CodePen - Twitch Social Popup</title>
  <link rel="stylesheet" href="./style.css">

<link rel="stylesheet" href="online-settings.css">
</head>
<body>
<!-- partial:index.partial.html -->
<link href='https://fonts.googleapis.com/css?family=Montserrat:700' rel='stylesheet' type='text/css'> 
<div id="popup-container">


    <div class="popup instagram-pop" data-box="enableInstagram">
     <div class="left">
       <span class="instagram"></span>
     </div>
     <div class="right instagramUsername">
       <span data-name="instagramUsername"></span>
     </div>
   </div> 

   <div class="popup twitter-pop" data-box="enableTwitter">
     <div class="left">
       <span class="twitter"></span>
     </div>
     <div class="right twitterUsername">
       <span data-name="twitterUsername"></span>
     </div>
   </div>

   <div class="popup tiktok-pop" data-box="enableTiktok">
     <div class="left">
       <span class="tiktok"></span>
     </div>
     <div class="right tiktokUsername">
       <span data-name="tiktokUsername"></span>
     </div>
   </div>

   <div class="popup youtube-pop" data-box="enableYoutube">
     <div class="left">
       <span class="youtube"></span>
     </div>
     <div class="right youtubeUsername">
       <span data-name="youtubeUsername"></span>
     </div>
   </div>

   <div class="popup twitch-pop" data-box="enableTwitch">
     <div class="left">
       <span class="twitch"></span>
     </div>
     <div class="right twitchUsername">
       <span data-name="twitchUsername"></span>
     </div>
   </div>

   <div class="popup kick-pop" data-box="enableKick">
     <div class="left">
       <span class="kick"></span>
     </div>
     <div class="right kickUsername">
       <span data-name="kickUsername"></span>
     </div>
   </div>


   <div class="popup steam-pop" data-box="enableSteam">
     <div class="left">
       <span class="steam"></span>
     </div>
     <div class="right steamUsername">
       <span data-name="steamUsername"></span>
     </div>
   </div>

    </div>

<!-- partial -->
  <script src='https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js'></script><script  src="./script.js"></script>


<button id="settingsOpen" type="button">⚙ Ayarlar</button>
<div id="settingsPanel">
  <div id="settingsBox">
    <h2>Social Popup Ayarları</h2>
    <div class="hint">Ayarlar bu tarayıcıda kaydedilir. Moblin/OBS'de aynı URL'yi kullanabilirsin.</div>
    <form id="settingsForm">
      <div class="sp-grid">
        <div class="sp-field"><label>Instagram</label><div class="sp-social-row"><input name="instagram" placeholder="kullaniciadi"><label class="sp-toggle"><input type="checkbox" name="enableInstagram"><span>Açık</span></label></div></div>
        <div class="sp-field"><label>YouTube</label><div class="sp-social-row"><input name="youtube" placeholder="kanal"><label class="sp-toggle"><input type="checkbox" name="enableYoutube"><span>Açık</span></label></div></div>
        <div class="sp-field"><label>Twitch</label><div class="sp-social-row"><input name="twitch" placeholder="kanal"><label class="sp-toggle"><input type="checkbox" name="enableTwitch"><span>Açık</span></label></div></div>
        <div class="sp-field"><label>Kick</label><div class="sp-social-row"><input name="kick" placeholder="kanal"><label class="sp-toggle"><input type="checkbox" name="enableKick"><span>Açık</span></label></div></div>
        <div class="sp-field"><label>TikTok</label><div class="sp-social-row"><input name="tiktok" placeholder="kullaniciadi"><label class="sp-toggle"><input type="checkbox" name="enableTiktok"><span>Açık</span></label></div></div>
        <div class="sp-field"><label>X / Twitter</label><div class="sp-social-row"><input name="x" placeholder="kullaniciadi"><label class="sp-toggle"><input type="checkbox" name="enableTwitter"><span>Açık</span></label></div></div>
        <div class="sp-field"><label>Boyut (scale)</label><input name="scale" type="number" step="0.05" min="0.2" max="3"></div>
        <div class="sp-field"><label>Animasyon hızı</label><input name="speed" type="number" step="0.05" min="0.05" max="10"></div>
        <div class="sp-field"><label>Gösterim süresi (sn)</label><input name="duration" type="number" step="0.5" min="0.5" max="60"></div>
        <div class="sp-field"><label>Yatay offset (px)</label><input name="offsetX" type="number" step="1"></div>
        <div class="sp-field"><label>Dikey offset (px)</label><input name="offsetY" type="number" step="1"></div>
        <div class="sp-field full"><label>Özel CSS (isteğe bağlı)</label><textarea name="customCSS" placeholder="Örn: body { ... }"></textarea></div>
      </div>
      <div class="sp-actions">
        <button type="submit">Kaydet</button>
        <button id="settingsReset" class="secondary" type="button">Sıfırla</button>
        <button id="settingsClose" class="secondary" type="button">Kapat</button>
      </div>
      <div id="settingsStatus"></div>
    </form>
  </div>
</div>

<script src="online-settings.js"></script>
</body>
</html>
